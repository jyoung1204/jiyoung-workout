var x=document.getElementsByClassName("wt"),q=document.getElementsByClassName("st"),y=document.getElementsByClassName("rp"),z=document.getElementsByClassName("dn"),i;for(i=0;i<x.length;i++)x[i].oninput=function(){record(this.getAttribute("data-i")).weight=this.value;persist()};for(i=0;i<q.length;i++)q[i].oninput=function(){record(this.getAttribute("data-i")).sets=this.value;persist()};for(i=0;i<y.length;i++)y[i].oninput=function(){record(this.getAttribute("data-i")).reps=this.value;persist()};for(i=0;i<z.length;i++)z[i].onchange=function(){record(this.getAttribute("data-i")).done=this.checked;persist()};document.getElementById("note").oninput=function(){db["note|"+current]=this.value;persist()};document.getElementById("reset").onclick=document.getElementById("clear").onclick=function(){if(confirm("Clear this routine?")){var i;for(i=0;i<routines[current].length;i++)delete db[key(i)];delete db["note|"+current];persist();home()}};document.getElementById("save").onclick=function(){var d=dateKey(new Date());if(!db.sessions)db.sessions={};db.sessions[d]={routine:current,category:categoryOf(current),time:new Date().getTime(),exercises:routines[current].map(function(ex,i){var r=record(i);return {name:exerciseLabel(ex[1]),weight:r.weight||"",reps:r.reps===""||r.reps==null?repDefault(ex):r.reps,sets:isCardio(ex)?1:r.sets||ex[2],unit:exerciseUnit(ex),done:!!r.done}}),note:db["note|"+current]||""};persist();alert("Workout saved! 💗")};document.getElementById("share").onclick=share}
function share(){var a=routines[current],now=new Date(),days=["SUN","MON","TUE","WED","THU","FRI","SAT"],months=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"],h='<div class="share"><div class="share-content"><div class="share-day">'+pad(now.getDate())+'</div><div class="share-date">'+months[now.getMonth()]+' '+pad(now.getDate())+' ('+days[now.getDay()]+')</div><div class="share-list">',i,r,count=0;for(i=0;i<a.length;i++){r=record(i);if(!r.done)continue;count++;var reps=(r.reps===""||r.reps==null?repDefault(a[i]):r.reps),sets=(r.sets||a[i][2]),metric;if(isCardio(a[i]))metric=safeText(reps)+" min";else if(a[i][1]==="Hanging")metric=safeText(reps)+"s · "+safeText(sets)+" sets";else metric=(r.weight?safeText(r.weight)+"kg · ":"")+safeText(reps)+" · "+safeText(sets);h+='<div class="shareline"><b>'+safeText(exerciseLabel(a[i][1]))+'</b><span>'+metric+'</span></div>'}if(!count)h+='<div class="share-empty">No completed exercises yet.</div>';h+='</div><div class="share-brand">wangBBang</div></div></div>';document.getElementById("card").innerHTML=h;document.getElementById("card").scrollIntoView()}
function dateKey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}function pad(n){return n<10?"0"+n:""+n}
function sessionCat(v){if(!v)return "";if(v.category)return v.category.toLowerCase();return categoryOf(v.routine||"").toLowerCase()}
function safeText(v){return String(v==null?"":v).replace(/[&<>"']/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]})}

function calendar(){page="calendar";setNav("calendar");document.getElementById("routineTabs").innerHTML="";var now=new Date(),d=new Date(calendarViewDate.getFullYear(),calendarViewDate.getMonth(),1),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate(),today=dateKey(now),h='<section class="panel"><div class="title" style="display:flex;align-items:center;justify-content:space-between;gap:10px"><button type="button" onclick="changeCalendarMonth(-1)" aria-label="Previous month" style="border:0;background:#fff0f4;border-radius:12px;padding:8px 12px;color:#b52f64;font-size:20px">‹</button><span>🗓️ '+d.toLocaleString("en-US",{month:"long"})+' '+y+'</span><button type="button" onclick="changeCalendarMonth(1)" aria-label="Next month" style="border:0;background:#fff0f4;border-radius:12px;padding:8px 12px;color:#b52f64;font-size:20px">›</button></div><div class="calgrid">',i,k,v,c;var names=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];for(i=0;i<7;i++)h+='<div class="muted">'+names[i]+'</div>';for(i=0;i<first;i++)h+="<div></div>";for(i=1;i<=last;i++){k=y+"-"+pad(m+1)+"-"+pad(i);v=db.sessions&&db.sessions[k];c=sessionCat(v);if(!v&&k<today)c="rest";h+='<button type="button" class="day '+c+'" data-date="'+k+'">'+i+'</button>'}h+='</div><div class="legend"><span><i class="dot upper"></i>Upper</span><span><i class="dot lower"></i>Lower</span><span><i class="dot core"></i>Core</span><span><i class="dot rest"></i>Rest</span></div><div id="calendarDetail" aria-live="polite"></div></section>';document.getElementById("main").innerHTML=h;var days=document.querySelectorAll(".day[data-date]");for(i=0;i<days.length;i++)days[i].onclick=function(){for(var j=0;j<days.length;j++)days[j].classList.remove("selected");this.classList.add("selected");document.getElementById("calendarDetail").innerHTML=calendarDetail(this.getAttribute("data-date"),today)}}
function progress(){page="progress";setNav("progress");document.getElementById("routineTabs").innerHTML="";var ct={upper:0,lower:0,core:0,rest:0},k,c,total=0,today=dateKey(new Date()),start=null;if(db.sessions)for(k in db.sessions){c=sessionCat(db.sessions[k]);if(ct[c]!==undefined){ct[c]++;total++;if(!start||k<start)start=k}}if(start){var sd=new Date(start+"T00:00:00"),x,xk;for(x=new Date(sd);dateKey(x)<today;x.setDate(x.getDate()+1)){xk=dateKey(x);if(!(db.sessions&&db.sessions[xk])){ct.rest++;total++}}}var h='<section class="panel"><div class="title">📊 Progress</div><div class="summary"><div class="sum upper"><b>'+ct.upper+'</b>Upper</div><div class="sum lower"><b>'+ct.lower+'</b>Lower</div><div class="sum core"><b>'+ct.core+'</b>Core</div><div class="sum rest"><b>'+ct.rest+'</b>Rest</div></div><div class="title" style="font-size:16px;margin-top:22px">Workout Distribution</div>';["upper","lower","core","rest"].forEach(function(x){var p=total?Math.round(ct[x]*100/total):0;h+='<div class="barrow"><b>'+x.charAt(0).toUpperCase()+x.slice(1)+'</b><div class="bar"><div class="fill '+x+'" style="width:'+p+'%"></div></div><span>'+p+'%</span></div>'});h+='<div class="muted" style="margin-top:16px">'+total+' days shown · includes automatic Rest days</div></section>';document.getElementById("main").innerHTML=h}
