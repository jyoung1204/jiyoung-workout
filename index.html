function progress(){page="progress";document.getElementById("workoutDatePanel").style.display="none";setNav("progress");document.getElementById("routineTabs").innerHTML="";var ct={upper:0,lower:0,core:0,rest:0},k,c,total=0,today=dateKey(new Date()),start=null;if(db.sessions)for(k in db.sessions){c=sessionCat(db.sessions[k]);if(ct[c]!==undefined){ct[c]++;total++;if(!start||k<start)start=k}}if(start){var sd=new Date(start+"T00:00:00"),x,xk;for(x=new Date(sd);dateKey(x)<today;x.setDate(x.getDate()+1)){xk=dateKey(x);if(!(db.sessions&&db.sessions[xk])){ct.rest++;total++}}}var h='<section class="panel"><div class="title">📊 Progress</div><div class="summary"><div class="sum upper"><b>'+ct.upper+'</b>Upper</div><div class="sum lower"><b>'+ct.lower+'</b>Lower</div><div class="sum core"><b>'+ct.core+'</b>Core</div><div class="sum rest"><b>'+ct.rest+'</b>Rest</div></div><div class="title" style="font-size:16px;margin-top:22px">Workout Distribution</div>';["upper","lower","core","rest"].forEach(function(x){var p=total?Math.round(ct[x]*100/total):0;h+='<div class="barrow"><b>'+x.charAt(0).toUpperCase()+x.slice(1)+'</b><div class="bar"><div class="fill '+x+'" style="width:'+p+'%"></div></div><span>'+p+'%</span></div>'});h+='<div class="muted" style="margin-top:16px">'+total+' days shown · includes automatic Rest days</div></section>';document.getElementById("main").innerHTML=h}
function settings(){page="settings";document.getElementById("workoutDatePanel").style.display="none";setNav("settings");document.getElementById("routineTabs").innerHTML="";document.getElementById("main").innerHTML='<section class="panel"><div class="title">⚙️ Settings</div><p>왕빵궁둥이 · Pink Theme</p><p class="muted">Your workout data is stored on this device.</p></section>'}
function setNav(p){var n=document.getElementsByClassName("nav"),i;for(i=0;i<n.length;i++)n[i].className="nav"+(n[i].getAttribute("data-page")===p?" on":"")}
var cats=document.getElementsByClassName("cat"),ci;for(ci=0;ci<cats.length;ci++)cats[ci].onclick=function(){var c=this.getAttribute("data-cat");setCat(c);if(page==="home"){if(c==="Upper")current="Dumbbell Upper";else if(c==="Lower")current="Machine Lower";else if(c==="Core")current="Core";else if(c==="Rest"){var d=dateKey(new Date());if(!db.sessions)db.sessions={};db.sessions[d]={routine:"Rest",category:"Rest",time:new Date().getTime()};persist();alert("Rest day saved! 🍃");activeCat="Today"}home()}else if(page==="calendar")calendar();else if(page==="progress")progress()};var nav=document.getElementsByClassName("nav"),i;for(i=0;i<nav.length;i++)nav[i].onclick=function(){var p=this.getAttribute("data-page");if(p==="home")home();else if(p==="calendar")calendar();else if(p==="progress")progress();else settings()};
function boot(){try{var workoutDateInput=document.getElementById("workoutDate");workoutDateInput.value=selectedWorkoutDate;workoutDateInput.max=dateKey(new Date());var requested=new URLSearchParams(location.search).get("routine");if(lowerMachineSources.indexOf(requested)>=0)requested="Machine Lower";if(upperMachineSources.indexOf(requested)>=0)requested="Upper Machine";if(dumbbellUpperSources.indexOf(requested)>=0)requested="Dumbbell Upper";if(coreSources.indexOf(requested)>=0)requested="Core";if(requested&&routines[requested]){current=requested;activeCat=categoryOf(requested)}var now=new Date();document.getElementById("date").innerHTML="📅 "+now.getFullYear()+"."+pad(now.getMonth()+1)+"."+pad(now.getDate());home();}catch(e){document.getElementById("main").innerHTML='<section class="panel"><div class="title">APP ERROR</div><div class="muted">'+String(e.message||e)+'</div></section>';}}
boot();
</script></body></html>
