<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>지영이 운동 앱</title><meta name="theme-color" content="#f477a1"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Malgun Gothic",sans-serif;background:#f6f6f3;color:#202020}.wrap{max-width:760px;margin:auto;padding:22px 16px 50px}h1{margin:0 0 5px;font-size:28px}.sub{color:#777;margin-bottom:18px}nav{display:flex;gap:8px;overflow:auto;margin-bottom:16px}nav button{border:0;background:#fff;padding:11px 14px;border-radius:12px;cursor:pointer;white-space:nowrap;box-shadow:0 1px 5px #00000012}nav button.active{background:#202020;color:#fff}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0000000b}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{font-size:12px;background:#eee;padding:5px 8px;border-radius:99px;color:#555}.exercise{font-size:18px;font-weight:700}.target{font-size:13px;color:#777;margin-top:4px}.sets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.set{border:1px solid #ddd;border-radius:12px;padding:9px}.set label{font-size:11px;color:#888;display:block}.set input{width:100%;border:0;border-bottom:1px solid #ddd;font-size:17px;padding:5px 2px;outline:0}.done{margin-top:9px;width:100%;padding:10px;border:0;border-radius:10px;background:#eee;cursor:pointer}.done.checked{background:#222;color:#fff}button.primary{width:100%;padding:13px;border:0;border-radius:12px;background:#222;color:white;font-size:15px;cursor:pointer}.small{font-size:12px;color:#777}.progress{height:9px;background:#eee;border-radius:9px;overflow:hidden;margin:10px 0}.bar{height:100%;background:#222;width:0}@media(max-width:520px){.sets{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="wrap"><h1>지영이 운동 앱 🏋️</h1><div class="sub">지난 기록을 보고 오늘 조금씩 발전하기</div><nav id="tabs"></nav><div id="app"></div></div>
<script>
const routines={"덤벨 상체 A":[["덤벨 벤치프레스","8–12회 × 3세트"],["원암 덤벨 로우","8–12회 × 3세트"],["덤벨 숄더프레스","8–12회 × 3세트"],["덤벨 레터럴 레이즈","12–15회 × 3세트"],["덤벨 컬","10–12회 × 2세트"],["덤벨 오버헤드 트라이셉스 익스텐션","10–12회 × 2세트"]],"덤벨 상체 B":[["인클라인 덤벨 프레스","8–12회 × 3세트"],["덤벨 로우","8–12회 × 3세트"],["덤벨 아놀드 프레스","8–12회 × 3세트"],["덤벨 리어델트 플라이","12–15회 × 3세트"],["해머 컬","10–12회 × 2세트"],["덤벨 킥백","10–12회 × 2세트"]],"덤벨 하체 A":[["덤벨 고블릿 스쿼트","10–12회 × 3세트"],["덤벨 루마니안 데드리프트","10–12회 × 3세트"],["덤벨 불가리안 스플릿 스쿼트","각 다리 8–10회 × 3세트"],["덤벨 힙 쓰러스트","12–15회 × 3세트"],["덤벨 리버스 런지","각 다리 10회 × 2세트"],["덤벨 카프레이즈","15–20회 × 3세트"]],"덤벨 하체 B":[["덤벨 스쿼트","8–12회 × 3세트"],["덤벨 스모 스쿼트","10–12회 × 3세트"],["덤벨 싱글레그 RDL","각 다리 8–10회 × 3세트"],["덤벨 글루트 브리지","12–15회 × 3세트"],["덤벨 워킹 런지","각 다리 10회 × 2세트"],["덤벨 카프레이즈","15–20회 × 3세트"]],"코어":[["행잉 레그레이즈","8–12회 × 3세트"],["리버스 크런치","10–15회 × 3세트"],["팔로프 프레스","10–12회 × 3세트"],["케이블 우드초퍼","10–12회 × 3세트"],["하이퍼익스텐션","10–15회 × 3세트"]],"기구 상체 A":[["랫풀다운","8–12회 × 3세트"],["시티드 로우","8–12회 × 3세트"],["체스트 프레스","8–12회 × 3세트"],["숄더 프레스","8–12회 × 3세트"],["델토이드 플라이","12–15회 × 3세트"]],"기구 상체 B":[["프론트 풀다운","8–12회 × 3세트"],["레버 로우","8–12회 × 3세트"],["와이드 풀다운","8–12회 × 3세트"],["델토이드 플라이","12–15회 × 3세트"],["딥스","8–12회 × 3세트"]],"기구 하체 A":[["레그프레스","8–12회 × 3세트"],["레그컬","10–12회 × 3세트"],["레그익스텐션","10–12회 × 3세트"],["힙프레스","10–15회 × 3세트"],["어브덕션","12–15회 × 3세트"]],"기구 하체 B":[["몬스터","10–15회 × 3세트"],["레그프레스","8–12회 × 3세트"],["어덕션","12–15회 × 3세트"],["스탠딩 힙 어브덕션","10–15회 × 3세트"],["시티드 레그컬","10–12회 × 3세트"]]};
let current=localStorage.getItem("routine")||"덤벨 하체 A";let history=JSON.parse(localStorage.getItem("workoutHistory")||"{}");function save(){localStorage.setItem("workoutHistory",JSON.stringify(history))}function setsFor(t){let m=t.match(/(\d+)(?:–|-)(\d+).*× (\d+)/);return m?Number(m[3]):3}
function render(){document.getElementById("tabs").innerHTML=Object.keys(routines).map(r=>'<button class="'+(r==current?'active':'')+'" onclick="selectR(\''+r+'\')">'+r+'</button>').join("");const list=routines[current];let total=list.reduce((a,x)=>a+setsFor(x[1]),0);let h='<div class="card"><div class="row"><div><b>오늘의 운동</b><div class="small">'+current+'</div></div><span class="badge">'+total+' working sets</span></div><div class="progress"><div id="bar" class="bar"></div></div><div class="small" id="pct">0% 완료</div></div>';list.forEach((x,i)=>{let n=setsFor(x[1]),key=current+"|"+i,rec=history[key]||{sets:[],checks:[]};let all=rec.checks?.every(Boolean)&&rec.checks?.length==n;h+='<div class="card"><div class="row"><div><div class="exercise">'+x[0]+'</div><div class="target">'+x[1]+'</div></div><span class="badge">기록</span></div><div class="sets">'+Array.from({length:n},(_,s)=>'<div class="set"><label>'+(s+1)+'세트</label><input inputmode="decimal" placeholder="kg" value="'+(rec.sets?.[s]?.w||'')+'" oninput="upd('+i+','+s+',\'w\',this.value)"><input inputmode="numeric" placeholder="회" value="'+(rec.sets?.[s]?.r||'')+'" oninput="upd('+i+','+s+',\'r\',this.value)"></div>').join("")+'</div><button class="done '+(all?'checked':'')+'" onclick="toggle('+i+','+n+')">'+(all?'✓ 완료':'세트 완료 체크')+'</button></div>'});h+='<div class="card"><div class="row"><b>오늘 메모</b><span class="small">컨디션 / 통증 / 느낌</span></div><textarea id="note" style="width:100%;margin-top:10px;border:1px solid #ddd;border-radius:10px;padding:10px;min-height:80px">'+(history["NOTE|"+current]||"")+'</textarea><button class="done" onclick="saveNote()">메모 저장</button></div><div class="card"><button class="primary" onclick="finish()">오늘 운동 저장하기</button></div>';document.getElementById("app").innerHTML=h;updateProgress()}
function selectR(r){current=r;localStorage.setItem("routine",r);render()}function upd(i,s,k,v){let key=current+"|"+i;history[key]||={sets:[],checks:[]};history[key].sets||=[];history[key].sets[s]||={};history[key].sets[s][k]=v;save()}function toggle(i,n){let key=current+"|"+i;history[key]||={sets:[],checks:[]};history[key].checks||=Array(n).fill(false);if(history[key].checks.length<n)history[key].checks=Array(n).fill(false);let j=history[key].checks.findIndex(x=>!x);if(j>=0)history[key].checks[j]=true;else history[key].checks=Array(n).fill(false);save();render()}function updateProgress(){let total=routines[current].reduce((a,x)=>a+setsFor(x[1]),0),done=0;routines[current].forEach((_,i)=>{done+=history[current+"|"+i]?.checks?.filter(Boolean).length||0});let p=Math.round(done/total*100);document.getElementById("bar").style.width=p+"%";document.getElementById("pct").textContent=p+"% 완료"}function saveNote(){history["NOTE|"+current]=document.getElementById("note").value;save();alert("메모 저장했어!")}function finish(){history["SESSION|"+new Date().toISOString()]=current;save();alert("오늘 운동 저장 완료 💪")}render();
</script></body></html>
