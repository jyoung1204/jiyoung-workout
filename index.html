<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>지영이 운동 앱</title><meta name="theme-color" content="#f477a1"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Malgun Gothic",sans-serif;background:#fff8f3;color:#533b3b}.wrap{max-width:760px;margin:auto;padding:22px 16px 50px}h1{margin:0 0 5px;font-size:28px;color:#b9436b}.sub{color:#9b747d;margin-bottom:18px}nav{display:flex;gap:8px;overflow:auto;margin-bottom:16px;padding-bottom:4px}nav button{border:1px solid #ffd0dd;background:#fff;padding:11px 14px;border-radius:14px;cursor:pointer;white-space:nowrap;color:#9b526a;box-shadow:0 2px 8px #e76f9a12}nav button.active{background:#f477a1;color:#fff;border-color:#f477a1}.card{background:#fff;border:1px solid #ffe1e9;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 4px 16px #e76f9a12}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{font-size:12px;background:#fff0f4;padding:5px 8px;border-radius:99px;color:#b85b79}.exercise{font-size:18px;font-weight:700}.target{font-size:13px;color:#a47b84;margin-top:4px}.sets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.set{border:1px solid #ffd8e3;border-radius:14px;padding:9px;background:#fffafb}.set label{font-size:11px;color:#b98b96;display:block}.set input{width:100%;border:0;border-bottom:1px solid #f3cbd6;background:transparent;font-size:17px;padding:5px 2px;outline:0;color:#533b3b}.setcheck{width:100%;margin-top:8px;border:0;border-radius:9px;padding:7px;background:#f8e8ed;color:#b85b79}.setcheck.checked{background:#f477a1;color:white}.done{margin-top:9px;width:100%;padding:10px;border:0;border-radius:12px;background:#fff0f4;color:#b9436b;cursor:pointer}.done.checked{background:#f477a1;color:#fff}button.primary{width:100%;padding:13px;border:0;border-radius:13px;background:#f477a1;color:white;font-size:15px;font-weight:700;cursor:pointer}.small{font-size:12px;color:#9b747d}.progress{height:9px;background:#f9e1e8;border-radius:9px;overflow:hidden;margin:10px 0}.bar{height:100%;background:#f477a1;width:0}.sharecard{background:linear-gradient(145deg,#fffaf6,#ffe6ed);border:1px solid #ffd4df;border-radius:24px;padding:22px;margin:16px 0}.sharetitle{font-size:24px;font-weight:800;color:#b9436b}.sharedate{font-size:13px;color:#a87986;margin:4px 0 16px}.shareline{padding:9px 0;border-bottom:1px solid #f4ced8;font-size:14px}.shareline:last-child{border:0}.shareline b{display:block;font-size:15px}.sharefoot{text-align:center;margin-top:16px;color:#d3668c;font-size:12px}.shareactions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hidden{display:none}@media(max-width:520px){.sets{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="wrap"><h1>지영이 운동 앱 🏋️</h1><div class="sub">지난 기록을 보고 오늘 조금씩 발전하기</div><nav id="tabs"></nav><div id="app"></div></div>
<script>
const routines={"덤벨 상체 A":[["덤벨 벤치프레스","8–12회 × 3세트"],["원암 덤벨 로우","8–12회 × 3세트"],["덤벨 숄더프레스","8–12회 × 3세트"],["덤벨 레터럴 레이즈","12–15회 × 3세트"],["덤벨 컬","10–12회 × 2세트"],["덤벨 오버헤드 트라이셉스 익스텐션","10–12회 × 2세트"]],"덤벨 상체 B":[["인클라인 덤벨 프레스","8–12회 × 3세트"],["덤벨 로우","8–12회 × 3세트"],["덤벨 아놀드 프레스","8–12회 × 3세트"],["덤벨 리어델트 플라이","12–15회 × 3세트"],["해머 컬","10–12회 × 2세트"],["덤벨 킥백","10–12회 × 2세트"]],"덤벨 하체 A":[["덤벨 고블릿 스쿼트","10–12회 × 3세트"],["덤벨 루마니안 데드리프트","10–12회 × 3세트"],["덤벨 불가리안 스플릿 스쿼트","각 다리 8–10회 × 3세트"],["덤벨 힙 쓰러스트","12–15회 × 3세트"],["덤벨 리버스 런지","각 다리 10회 × 2세트"],["덤벨 카프레이즈","15–20회 × 3세트"]],"덤벨 하체 B":[["덤벨 스쿼트","8–12회 × 3세트"],["덤벨 스모 스쿼트","10–12회 × 3세트"],["덤벨 싱글레그 RDL","각 다리 8–10회 × 3세트"],["덤벨 글루트 브리지","12–15회 × 3세트"],["덤벨 워킹 런지","각 다리 10회 × 2세트"],["덤벨 카프레이즈","15–20회 × 3세트"]],"코어":[["행잉 레그레이즈","8–12회 × 3세트"],["리버스 크런치","10–15회 × 3세트"],["팔로프 프레스","10–12회 × 3세트"],["케이블 우드초퍼","10–12회 × 3세트"],["하이퍼익스텐션","10–15회 × 3세트"]],"기구 상체 A":[["랫풀다운","8–12회 × 3세트"],["시티드 로우","8–12회 × 3세트"],["체스트 프레스","8–12회 × 3세트"],["숄더 프레스","8–12회 × 3세트"],["델토이드 플라이","12–15회 × 3세트"]],"기구 상체 B":[["프론트 풀다운","8–12회 × 3세트"],["레버 로우","8–12회 × 3세트"],["와이드 풀다운","8–12회 × 3세트"],["델토이드 플라이","12–15회 × 3세트"],["딥스","8–12회 × 3세트"]],"기구 하체 A":[["레그프레스","8–12회 × 3세트"],["레그컬","10–12회 × 3세트"],["레그익스텐션","10–12회 × 3세트"],["힙프레스","10–15회 × 3세트"],["어브덕션","12–15회 × 3세트"]],"기구 하체 B":[["몬스터","10–15회 × 3세트"],["레그프레스","8–12회 × 3세트"],["어덕션","12–15회 × 3세트"],["스탠딩 힙 어브덕션","10–15회 × 3세트"],["시티드 레그컬","10–12회 × 3세트"]]};
let current=localStorage.getItem("routine")||"덤벨 하체 A";let history=JSON.parse(localStorage.getItem("workoutHistory")||"{}");function save(){localStorage.setItem("workoutHistory",JSON.stringify(history))}function setsFor(t){let m=t.match(/(\d+)(?:–|-)(\d+).*× (\d+)/);return m?Number(m[3]):3}
function render(){document.getElementById("tabs").innerHTML=Object.keys(routines).map(r=>'<button class="'+(r==current?'active':'')+'" onclick="selectR(decodeURIComponent(this.dataset.r))" data-r="'+encodeURIComponent(r)+'">'+r+'</button>').join("");const list=routines[current];let total=list.reduce((a,x)=>a+setsFor(x[1]),0);let h='<div class="card"><div class="row"><div><b>오늘의 운동 💗</b><div class="small">'+current+'</div></div><span class="badge">'+total+' sets</span></div><div class="progress"><div id="bar" class="bar"></div></div><div class="small" id="pct">0% 완료</div></div>';list.forEach((x,i)=>{let n=setsFor(x[1]),key=current+"|"+i,rec=history[key]||{sets:[],checks:[]};rec.checks=rec.checks||Array(n).fill(false);h+='<div class="card"><div class="exercise">'+x[0]+'</div><div class="target">'+x[1]+'</div><div class="sets">'+Array.from({length:n},(_,s)=>'<div class="set"><label>'+(s+1)+'세트</label><input inputmode="decimal" placeholder="kg" value="'+(rec.sets?.[s]?.w||'')+'" oninput="upd('+i+','+s+',\'w\',this.value)"><input inputmode="numeric" placeholder="회" value="'+(rec.sets?.[s]?.r||'')+'" oninput="upd('+i+','+s+',\'r\',this.value)"><button class="setcheck '+(rec.checks[s]?'checked':'')+'" onclick="toggleSet('+i+','+s+','+n+')">'+(rec.checks[s]?'✓ 완료':'○ 체크')+'</button></div>').join("")+'</div></div>'});h+='<div class="card"><div class="row"><b>오늘 메모</b><span class="small">컨디션 / 통증 / 느낌</span></div><textarea id="note" style="width:100%;margin-top:10px;border:1px solid #ffd8e3;border-radius:12px;padding:10px;min-height:70px;background:#fffafb">'+(history["NOTE|"+current]||"")+'</textarea><button class="done" onclick="saveNote()">메모 저장</button></div><div class="card"><button class="primary" onclick="finish()">오늘 운동 저장하기 ♥</button><button class="done" onclick="showShare()">인스타 기록 한 장으로 보기 📸</button></div><div id="shareArea" class="hidden"></div>';document.getElementById("app").innerHTML=h;updateProgress()}
function selectR(r){current=r;localStorage.setItem("routine",r);render()}function upd(i,s,k,v){let key=current+"|"+i;history[key]||={sets:[],checks:[]};history[key].sets||=[];history[key].sets[s]||={};history[key].sets[s][k]=v;save()}function toggleSet(i,s,n){let key=current+"|"+i;history[key]||={sets:[],checks:Array(n).fill(false)};history[key].checks||=Array(n).fill(false);while(history[key].checks.length<n)history[key].checks.push(false);history[key].checks[s]=!history[key].checks[s];save();render()}function updateProgress(){let total=routines[current].reduce((a,x)=>a+setsFor(x[1]),0),done=0;routines[current].forEach((_,i)=>{done+=history[current+"|"+i]?.checks?.filter(Boolean).length||0});let p=Math.round(done/total*100);document.getElementById("bar").style.width=p+"%";document.getElementById("pct").textContent=p+"% 완료"}function esc(v){return String(v||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function showShare(){saveNote(false);let d=new Date();let date=d.getFullYear()+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getDate()).padStart(2,"0");let lines=routines[current].map((x,i)=>{let r=history[current+"|"+i]||{};let vals=(r.sets||[]).map((s,j)=>(s.w||s.r)?((s.w?s.w+"kg ":"")+(s.r?s.r+"회":"")):"").filter(Boolean);let done=(r.checks||[]).filter(Boolean).length;return '<div class="shareline"><b>'+esc(x[0])+(done?' ✓':'')+'</b>'+(vals.length?esc(vals.join(" · ")):esc(x[1]))+'</div>'}).join("");let note=history["NOTE|"+current];document.getElementById("shareArea").className="sharecard";document.getElementById("shareArea").innerHTML='<div class="sharetitle">TODAY WORKOUT ♥</div><div class="sharedate">'+date+' · '+esc(current)+'</div>'+lines+(note?'<div class="shareline"><b>memo</b>'+esc(note)+'</div>':'')+'<div class="sharefoot">JY WORKOUT LOG 🏋️💗</div><div class="shareactions"><button class="done" onclick="window.scrollTo({top:document.getElementById(\'shareArea\').offsetTop-10,behavior:\'smooth\'})">캡처 위치 맞추기</button><button class="done" onclick="document.getElementById(\'shareArea\').className=\'hidden\'">닫기</button></div>';setTimeout(()=>document.getElementById("shareArea").scrollIntoView({behavior:"smooth",block:"start"}),100)}
function saveNote(alertIt=true){history["NOTE|"+current]=document.getElementById("note").value;save();if(alertIt)alert("메모 저장했어!")}function finish(){history["SESSION|"+new Date().toISOString()]=current;save();alert("오늘 운동 저장 완료 💪")}render();
</script><script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"))}
</script></body></html>
