  routines[name].forEach(function(ex){
   var normalized=normalExercise(ex[1]);
   if(normalized==="leg raise"){if(!leg)leg=ex;return}
   if(normalized==="reverse crunch"){if(!reverse)reverse=ex;return}
   if(normalized==="dead hang"||normalized==="hanging"){if(!hanging){hanging=ex.slice();hanging[1]="Hanging"}return}
   if(isCardio(ex)||normalized==="easy cardio"||normalized==="cardio"){if(!cardio)cardio=ex;return}
   rest.push(ex);
  });
  if(!leg)leg=["✦","Leg Raise",3,"15"];
  if(!reverse)reverse=["✦","Reverse Crunch",3,"15"];
  if(!hanging)hanging=["✦","Hanging",3,"30 sec"];
  if(!cardio)cardio=["♡","Easy Cardio",1,cardioMinutes(name)+" min","cardio"];
  cardio=cardio.slice();cardio[4]="cardio";
  routines[name]=rest.concat([leg,reverse,hanging,cardio]);
 });
