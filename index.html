<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JY Workout</title><meta name="theme-color" content="#f477a1"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Malgun Gothic",sans-serif;background:#fff8f3;color:#533b3b}.wrap{max-width:760px;margin:auto;padding:22px 16px 50px}h1{margin:0 0 5px;font-size:28px;color:#b9436b}.sub{color:#9b747d;margin-bottom:18px}nav{display:flex;gap:8px;overflow:auto;margin-bottom:16px;padding-bottom:4px}nav button{border:1px solid #ffd0dd;background:#fff;padding:11px 14px;border-radius:14px;cursor:pointer;white-space:nowrap;color:#9b526a;box-shadow:0 2px 8px #e76f9a12}nav button.active{background:#f477a1;color:#fff;border-color:#f477a1}.card{background:#fff;border:1px solid #ffe1e9;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 4px 16px #e76f9a12}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{font-size:12px;background:#fff0f4;padding:5px 8px;border-radius:99px;color:#b85b79}.exercise{font-size:18px;font-weight:700}.target{font-size:13px;color:#a47b84;margin-top:4px}.sets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.set{border:1px solid #ffd8e3;border-radius:14px;padding:9px;background:#fffafb}.set label{font-size:11px;color:#b98b96;display:block}.set input{width:100%;border:0;border-bottom:1px solid #f3cbd6;background:transparent;font-size:17px;padding:5px 2px;outline:0;color:#533b3b}.setcheck{width:100%;margin-top:8px;border:0;border-radius:9px;padding:7px;background:#f8e8ed;color:#b85b79}.setcheck.checked{background:#f477a1;color:white}.done{margin-top:9px;width:100%;padding:10px;border:0;border-radius:12px;background:#fff0f4;color:#b9436b;cursor:pointer}.done.checked{background:#f477a1;color:#fff}button.primary{width:100%;padding:13px;border:0;border-radius:13px;background:#f477a1;color:white;font-size:15px;font-weight:700;cursor:pointer}.small{font-size:12px;color:#9b747d}.progress{height:9px;background:#f9e1e8;border-radius:9px;overflow:hidden;margin:10px 0}.bar{height:100%;background:#f477a1;width:0}.sharecard{background:linear-gradient(145deg,#fffaf6,#ffe6ed);border:1px solid #ffd4df;border-radius:24px;padding:22px;margin:16px 0}.sharetitle{font-size:24px;font-weight:800;color:#b9436b}.sharedate{font-size:13px;color:#a87986;margin:4px 0 16px}.shareline{padding:9px 0;border-bottom:1px solid #f4ced8;font-size:14px}.shareline:last-child{border:0}.shareline b{display:block;font-size:15px}.sharefoot{text-align:center;margin-top:16px;color:#d3668c;font-size:12px}.shareactions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hidden{display:none}@media(max-width:520px){.sets{grid-template-columns:repeat(2,1fr)}}
</style><style>.sub{font-weight:800;letter-spacing:5px;color:#b9436b;font-size:14px;text-transform:uppercase}.exercise:before{content:"🏋️ ";font-size:16px}.card:nth-of-type(n+2){position:relative}</style></head><body><div class="wrap"><h1>JY WORKOUT 🏋️</h1><div class="sub">CONSISTENCY</div><nav id="tabs"></nav><div id="app"></div></div>
<script>
const routines={"Dumbbell Upper A":[["Dumbbell Bench Press","8–12 reps × 3 sets"],["One-Arm Dumbbell Row","8–12 reps × 3 sets"],["Dumbbell Shoulder Press","8–12 reps × 3 sets"],["Dumbbell Lateral Raise","12–15 reps × 3 sets"],["Dumbbell Curl","10–12 reps × 2 sets"],["Dumbbell Overhead Triceps Extension","10–12 reps × 2 sets"]],"Dumbbell Upper B":[["Incline Dumbbell Press","8–12 reps × 3 sets"],["Dumbbell Row","8–12 reps × 3 sets"],["Dumbbell Arnold Press","8–12 reps × 3 sets"],["Dumbbell Rear Delt Fly","12–15 reps × 3 sets"],["Hammer Curl","10–12 reps × 2 sets"],["Dumbbell Kickback","10–12 reps × 2 sets"]],"Dumbbell Lower A":[["Hip Thrust","10–12 reps × 3 sets"],["Leg Press","8–12 reps × 3 sets"],["V-Squat","8–12 reps × 3 sets"],["Bulgarian Split Squat","8–10 reps/leg × 3 sets"],["Romanian Deadlift (RDL)","8–12 reps × 3 sets"],["Single-Leg RDL","8–10 reps/leg × 3 sets"],["Dumbbell Step-Up","8–12 reps/leg × 3 sets"],["Kettlebell Wide Squat","10–12 reps × 3 sets"],["Dumbbell Pause Squat","8–12 reps × 3 sets"],["Dumbbell Reverse Lunge","10 reps/leg × 3 sets"]],"Dumbbell Lower B":[["Dumbbell Squat","8–12 reps × 3 sets"],["Dumbbell Sumo Squat","10–12 reps × 3 sets"],["Single-Leg RDL","8–10 reps/leg × 3 sets"],["Dumbbell Glute Bridge","12–15 reps × 3 sets"],["Dumbbell Walking Lunge","10 reps/leg × 2 sets"],["Dumbbell Calf Raise","15–20 reps × 3 sets"]],"Core":[["Hanging Leg Raise","8–12 reps × 3 sets"],["Reverse Crunch","10–15 reps × 3 sets"],["Pallof Press","10–12 reps × 3 sets"],["Cable Wood Chop","10–12 reps × 3 sets"],["Back Extension","10–15 reps × 3 sets"]],"Machine Upper A":[["Lat Pulldown","8–12 reps × 3 sets"],["Seated Row","8–12 reps × 3 sets"],["Chest Press","8–12 reps × 3 sets"],["Shoulder Press","8–12 reps × 3 sets"],["Rear Delt Fly","12–15 reps × 3 sets"]],"Machine Upper B":[["Front Pulldown","8–12 reps × 3 sets"],["Lever Row","8–12 reps × 3 sets"],["Wide-Grip Pulldown","8–12 reps × 3 sets"],["Rear Delt Fly","12–15 reps × 3 sets"],["Dips","8–12 reps × 3 sets"]],"Machine Lower A":[["Leg Press","8–12 reps × 3 sets"],["Leg Curl","10–12 reps × 3 sets"],["Leg Extension","10–12 reps × 3 sets"],["Hip Press","10–15 reps × 3 sets"],["Hip Abduction","12–15 reps × 3 sets"]],"Machine Lower B":[["Monster Glute Machine","10–15 reps × 3 sets"],["Leg Press","8–12 reps × 3 sets"],["Hip Adduction","12–15 reps × 3 sets"],["Standing Hip Abduction","10–15 reps × 3 sets"],["Seated Leg Curl","10–12 reps × 3 sets"]]};
let current=localStorage.getItem("routine")||"Dumbbell Lower A";if(!routines[current]){current="Dumbbell Lower A";localStorage.setItem("routine",current)}let history=JSON.parse(localStorage.getItem("workoutHistory")||"{}");function save(){localStorage.setItem("workoutHistory",JSON.stringify(history))}function setsFor(t){let m=t.match(/×\\s*(\\d+)\\s*sets?/i);return m?Number(m[1]):3}
function render(){document.getElementById("tabs").innerHTML=Object.keys(routines).map(r=>'<button class="'+(r==current?'active':'')+'" onclick="selectR(decodeURIComponent(this.dataset.r))" data-r="'+encodeURIComponent(r)+'">'+r+'</button>').join("");const list=routines[current];let total=list.reduce((a,x)=>a+setsFor(x[1]),0);let h='<div class="card"><div class="row"><div><b>TODAY'S WORKOUT 💗</b><div class="small">'+current+'</div></div><span class="badge">'+total+' sets</span></div><div class="progress"><div id="bar" class="bar"></div></div><div class="small" id="pct">0% DONE</div></div>';list.forEach((x,i)=>{let n=setsFor(x[1]),key=current+"|"+i,rec=history[key]||{sets:[],checks:[]};rec.checks=rec.checks||Array(n).fill(false);h+='<div class="card"><div class="exercise">'+x[0]+'</div><div class="target">'+x[1]+'</div><div class="sets">'+Array.from({length:n},(_,s)=>'<div class="set"><label>'+(s+1)+'SET</label><input inputmode="decimal" placeholder="kg" value="'+(rec.sets?.[s]?.w||'')+'" oninput="upd('+i+','+s+',\'w\',this.value)"><input inputmode="numeric" placeholder="reps" value="'+(rec.sets?.[s]?.r||'')+'" oninput="upd('+i+','+s+',\'r\',this.value)"><button class="setcheck '+(rec.checks[s]?'checked':'')+'" onclick="toggleSet('+i+','+s+','+n+')">'+(rec.checks[s]?'✓ DONE':'○ CHECK')+'</button></div>').join("")+'</div></div>'});h+='<div class="card"><div class="row"><b>TODAY NOTES</b><span class="small">Condition / pain / notes</span></div><textarea id="note" style="width:100%;margin-top:10px;border:1px solid #ffd8e3;border-radius:12px;padding:10px;min-height:70px;background:#fffafb">'+(history["NOTE|"+current]||"")+'</textarea><button class="done" onclick="saveNote()">SAVE NOTE</button></div><div class="card"><button class="primary" onclick="finish()">SAVE TODAY'S WORKOUT ♥</button><button class="done" onclick="showShare()">INSTAGRAM WORKOUT CARD 📸</button></div><div id="shareArea" class="hidden"></div>';document.getElementById("app").innerHTML=h;updateProgress()}
function selectR(r){current=r;localStorage.setItem("routine",r);render()}function upd(i,s,k,v){let key=current+"|"+i;history[key]||={sets:[],checks:[]};history[key].sets||=[];history[key].sets[s]||={};history[key].sets[s][k]=v;save()}function toggleSet(i,s,n){let key=current+"|"+i;history[key]||={sets:[],checks:Array(n).fill(false)};history[key].checks||=Array(n).fill(false);while(history[key].checks.length<n)history[key].checks.push(false);history[key].checks[s]=!history[key].checks[s];save();render()}function updateProgress(){let total=routines[current].reduce((a,x)=>a+setsFor(x[1]),0),done=0;routines[current].forEach((_,i)=>{done+=history[current+"|"+i]?.checks?.filter(Boolean).length||0});let p=Math.round(done/total*100);document.getElementById("bar").style.width=p+"%";document.getElementById("pct").textContent=p+"% DONE"}function esc(v){return String(v||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function showShare(){saveNote(false);let d=new Date();let date=d.getFullYear()+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getDate()).padStart(2,"0");let lines=routines[current].map((x,i)=>{let r=history[current+"|"+i]||{};let vals=(r.sets||[]).map((s,j)=>(s.w||s.r)?((s.w?s.w+"kg ":"")+(s.r?s.r+"reps":"")):"").filter(Boolean);let done=(r.checks||[]).filter(Boolean).length;return '<div class="shareline"><b>'+esc(x[0])+(done?' ✓':'')+'</b>'+(vals.length?esc(vals.join(" · ")):esc(x[1]))+'</div>'}).join("");let note=history["NOTE|"+current];document.getElementById("shareArea").className="sharecard";document.getElementById("shareArea").innerHTML='<div class="sharetitle">TODAY WORKOUT ♥</div><div class="sharedate">'+date+' · '+esc(current)+'</div>'+lines+(note?'<div class="shareline"><b>memo</b>'+esc(note)+'</div>':'')+'<div class="sharefoot">JY WORKOUT LOG 🏋️💗</div><div class="shareactions"><button class="done" onclick="window.scrollTo({top:document.getElementById(\'shareArea\').offsetTop-10,behavior:\'smooth\'})">VIEW CARD</button><button class="done" onclick="document.getElementById(\'shareArea\').className=\'hidden\'">CLOSE</button></div>';setTimeout(()=>document.getElementById("shareArea").scrollIntoView({behavior:"smooth",block:"start"}),100)}
function saveNote(alertIt=true){history["NOTE|"+current]=document.getElementById("note").value;save();if(alertIt)alert("SAVE NOTE했어!")}function finish(){history["SESSION|"+new Date().toISOString()]=current;save();alert("Workout saved! 💪")}render();
</script><script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"))}
</script></body></html>
