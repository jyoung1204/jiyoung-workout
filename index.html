<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JY WORKOUT</title><meta name="theme-color" content="#fff8f5"><link rel="manifest" href="./manifest.json"><style>
*{box-sizing:border-box}body{margin:0;background:#fff9f5;color:#222;font-family:Arial,sans-serif}.app{max-width:760px;margin:auto;padding:24px 16px 95px}.top{display:flex;justify-content:space-between;align-items:start}.brand{font-size:31px;font-weight:900;color:#d52d6d}.cons{font-size:14px;letter-spacing:6px;color:#bd2d61;font-weight:800;margin-top:8px}.motto{color:#80777d;font-size:12px;margin:7px 0 20px}.date{background:#fff0f4;border-radius:20px;padding:11px;color:#8a6672;font-size:12px}.cats,.routines{display:flex;gap:8px;overflow:auto;margin:10px 0}.pill{border:1px solid #f2d4dd;background:#fff;border-radius:18px;padding:11px 15px;white-space:nowrap;color:#9d315b;font-weight:700}.pill.on{background:#ef4b86;color:#fff}.panel{background:#fff;border:1px solid #f4dce3;border-radius:23px;padding:16px;margin-top:15px;box-shadow:0 5px 18px rgba(180,50,90,.05)}.panelhead{display:flex;justify-content:space-between;align-items:center}.title{font-size:21px;font-weight:900}.muted{font-size:12px;color:#8f8187}.reset{border:0;background:#fff0f4;color:#d43b72;border-radius:18px;padding:10px}.thead,.row{display:grid;grid-template-columns:32px 1fr 62px 48px 48px 44px;gap:6px;align-items:center}.thead{background:#fff2f5;padding:9px 5px;margin-top:14px;font-size:12px;font-weight:700}.row{padding:9px 5px;border-bottom:1px solid #f5e6ea}.num{width:29px;height:29px;border-radius:50%;background:#ffe7ee;color:#df3e78;display:flex;align-items:center;justify-content:center;font-weight:800}.exercise{font-weight:800;font-size:13px;display:flex;align-items:center;gap:8px}.exercise span{font-size:19px;margin-right:0}.exart{width:82px;height:64px;flex:0 0 82px;border-radius:14px;background:#fff8f5;object-fit:contain;object-position:center}.extext{min-width:0}.field{width:100%;border:1px solid #eadde1;border-radius:10px;padding:9px 4px;text-align:center;background:#fff;font-size:14px}.done{width:25px;height:25px}.notes{background:#fff0f4}.notes textarea{width:100%;height:90px;border:0;border-radius:14px;padding:13px;margin-top:10px}.actions{display:grid;grid-template-columns:1fr 1fr 2fr;gap:8px;margin-top:13px}.btn{border:0;border-radius:18px;padding:13px;font-weight:800;color:#d73d76;background:#fff0f4}.btn.save{background:#ef3f7e;color:#fff}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#fffdfb;border-top:1px solid #f1dfe5;padding:10px 5px 15px;z-index:5}.nav{text-align:center;color:#847981;font-size:11px;cursor:pointer}.nav b{display:block;font-size:22px}.nav.on{color:#df3472}.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:15px;text-align:center}.day{padding:10px 2px;border-radius:12px;background:#fff7f9}.day.hit{background:#ef4b86;color:#fff;font-weight:900}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:15px}.stat{background:#fff0f4;border-radius:18px;padding:20px;text-align:center}.stat b{display:block;font-size:28px;color:#d52d6d}.share{background:linear-gradient(145deg,#fff,#ffeaf0);border-radius:22px;padding:18px;margin-top:15px}.shareline{padding:8px 0;border-bottom:1px solid #efdce2;font-size:12px}@media(max-width:480px){.brand{font-size:28px}.thead,.row{grid-template-columns:29px 1fr 58px 43px 43px 36px}.exercise{font-size:12px}.actions{grid-template-columns:1fr 1fr}.btn.save{grid-column:1/3}}
</style></head><body><div class="app"><div class="top"><div><div class="brand">JY WORKOUT 🏋️‍♀️</div><div class="cons">CONSISTENCY</div></div><div id="date" class="date"></div></div><div class="motto">Discipline today, the body you love tomorrow.</div><div class="cats"><button class="pill">🏠 Today</button><button class="pill">💪🏻 Upper</button><button class="pill on">🍑 Lower</button><button class="pill">🏃‍♀️ Core</button><button class="pill">••• More</button></div><div id="routineTabs" class="routines"></div><main id="main"></main></div><div class="bottom"><div class="nav on" data-page="home"><b>🏠</b>Home</div><div class="nav" data-page="calendar"><b>🗓️</b>Calendar</div><div class="nav" data-page="progress"><b>📊</b>Progress</div><div class="nav" data-page="settings"><b>⚙️</b>Settings</div></div><script>
var routines={"Dumbbell Lower A":[["🍑","Hip Thrust",4,"10-12"],["🦵","Leg Press",4,"10-12"],["🏋️‍♀️","V-Squat",4,"10-12"],["🦵","Bulgarian Split Squat",3,"10 each"],["🏋️","Romanian Deadlift (RDL)",4,"10-12"],["⚖️","Single-Leg RDL",3,"10 each"],["🪜","Dumbbell Step-Up",3,"10 each"],["🏋️‍♀️","Kettlebell Wide Squat",4,"10-12"],["🏋️‍♀️","Dumbbell Pause Squat",3,"10-12"],["🦵","Dumbbell Reverse Lunge",3,"10 each"]],"Dumbbell Lower B":[["🦵","Dumbbell Squat",3,"8-12"],["🦵","Dumbbell Sumo Squat",3,"10-12"],["⚖️","Single-Leg RDL",3,"10 each"],["🍑","Dumbbell Glute Bridge",3,"12-15"],["🦵","Dumbbell Walking Lunge",2,"10 each"]],"Machine Lower A":[["🦵","Leg Press",3,"8-12"],["🦵","Leg Curl",3,"10-12"],["🦵","Leg Extension",3,"10-12"],["🍑","Hip Press",3,"10-15"],["🍑","Hip Abduction",3,"12-15"]],"Machine Lower B":[["🍑","Monster Glute Machine",3,"10-15"],["🦵","Leg Press",3,"8-12"],["🍑","Hip Adduction",3,"12-15"],["🍑","Standing Hip Abduction",3,"10-15"],["🦵","Seated Leg Curl",3,"10-12"]]};
var current="Dumbbell Lower A",db={};try{db=JSON.parse(localStorage.getItem("jydb")||"{}")||{}}catch(e){db={}}
function persist(){localStorage.setItem("jydb",JSON.stringify(db))}
function key(i){return current+"|"+i}function record(i){if(!db[key(i)])db[key(i)]={weights:[],done:false};return db[key(i)]}
function tabs(){var h="",ks=Object.keys(routines),i;for(i=0;i<ks.length;i++)h+='<button class="pill '+(ks[i]===current?'on':'')+'" data-r="'+ks[i]+'">'+ks[i]+'</button>';document.getElementById("routineTabs").innerHTML=h;var b=document.getElementById("routineTabs").getElementsByTagName("button");for(i=0;i<b.length;i++)b[i].onclick=function(){current=this.getAttribute("data-r");home()}}
function home(){setNav("home");tabs();var a=routines[current],h='<section class="panel"><div class="panelhead"><div><div class="title">🍑 '+current+'</div><div class="muted">Glutes · Legs · Stronger Lower Body</div></div><button class="reset" id="reset">↻ Reset All</button></div><div class="thead"><div>#</div><div>Exercise</div><div>Weight</div><div>Sets</div><div>Reps</div><div>Done</div></div>',i,r;for(i=0;i<a.length;i++){r=record(i);h+='<div class="row"><div class="num">'+(i+1)+'</div><div class="exercise"><img class="exart" style="width:96px!important;height:72px!important;object-fit:contain!important;object-position:center!important;border-radius:12px!important;background:#fff!important" src="https://raw.githubusercontent.com/jyoung1204/jiyoung-workout/main/ex'+(i+1)+'.jpg?v=4" alt="'+a[i][1]+'"><div class="extext">'+a[i][1]+'<div class="muted">'+a[i][2]+' sets</div></div></div><input class="field wt" inputmode="decimal" placeholder="kg" data-i="'+i+'" value="'+(r.weight||"")+'"><input class="field st" inputmode="numeric" placeholder="3" data-i="'+i+'" value="'+(r.sets||a[i][2])+'"><input class="field rp" inputmode="numeric" placeholder="12" data-i="'+i+'" value="'+(r.reps||"")+'"><input class="done dn" type="checkbox" data-i="'+i+'" '+(r.done?'checked':'')+'></div>'}h+='</section><section class="panel notes"><b>📝 Today\'s Notes</b><textarea id="note" placeholder="How was your workout today? 💕">'+(db["note|"+current]||"")+'</textarea></section><div class="actions"><button class="btn" id="clear">⌫ Clear</button><button class="btn" id="share">🖼 Share Image</button><button class="btn save" id="save">✓ Save Today\'s Workout</button></div><div id="card"></div>';document.getElementById("main").innerHTML=h;bindHome()}
function bindHome(){var x=document.getElementsByClassName("wt"),q=document.getElementsByClassName("st"),y=document.getElementsByClassName("rp"),z=document.getElementsByClassName("dn"),i;for(i=0;i<x.length;i++)x[i].oninput=function(){record(this.getAttribute("data-i")).weight=this.value;persist()};for(i=0;i<q.length;i++)q[i].oninput=function(){record(this.getAttribute("data-i")).sets=this.value;persist()};for(i=0;i<y.length;i++)y[i].oninput=function(){record(this.getAttribute("data-i")).reps=this.value;persist()};for(i=0;i<z.length;i++)z[i].onchange=function(){record(this.getAttribute("data-i")).done=this.checked;persist()};document.getElementById("note").oninput=function(){db["note|"+current]=this.value;persist()};document.getElementById("reset").onclick=document.getElementById("clear").onclick=function(){if(confirm("Clear this routine?")){var i;for(i=0;i<routines[current].length;i++)delete db[key(i)];delete db["note|"+current];persist();home()}};document.getElementById("save").onclick=function(){var d=dateKey(new Date());if(!db.sessions)db.sessions={};db.sessions[d]={routine:current,time:new Date().getTime()};persist();alert("Workout saved! 💗")};document.getElementById("share").onclick=share}
function share(){var a=routines[current],h='<div class="share"><div class="title">JY WORKOUT 💗</div><div class="muted">'+dateKey(new Date())+' · '+current+'</div>',i,r;for(i=0;i<a.length;i++){r=record(i);h+='<div class="shareline"><b>'+a[i][1]+'</b> · '+(r.sets||a[i][2])+' sets · '+(r.weight?r.weight+' kg':'— kg')+' · '+(r.reps||'—')+' reps '+(r.done?'✓':'')+'</div>'}h+='</div>';document.getElementById("card").innerHTML=h;document.getElementById("card").scrollIntoView()}
function dateKey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}function pad(n){return n<10?"0"+n:""+n}
function calendar(){setNav("calendar");document.getElementById("routineTabs").innerHTML="";var d=new Date(),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate(),h='<section class="panel"><div class="title">🗓️ '+d.toLocaleString("en-US",{month:"long"})+' '+y+'</div><div class="calgrid">',i,k;var names=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];for(i=0;i<7;i++)h+='<div class="muted">'+names[i]+'</div>';for(i=0;i<first;i++)h+="<div></div>";for(i=1;i<=last;i++){k=y+"-"+pad(m+1)+"-"+pad(i);h+='<div class="day '+(db.sessions&&db.sessions[k]?'hit':'')+'">'+i+'</div>'}h+='</div><div class="muted" style="margin-top:14px">Pink = saved workout day 💗</div></section>';document.getElementById("main").innerHTML=h}
function progress(){setNav("progress");document.getElementById("routineTabs").innerHTML="";var n=db.sessions?Object.keys(db.sessions).length:0;document.getElementById("main").innerHTML='<section class="panel"><div class="title">📊 Progress</div><div class="stats"><div class="stat"><b>'+n+'</b>Workout Days</div><div class="stat"><b>'+n+'</b>Saved Sessions</div></div></section>'}
function settings(){setNav("settings");document.getElementById("routineTabs").innerHTML="";document.getElementById("main").innerHTML='<section class="panel"><div class="title">⚙️ Settings</div><p>JY WORKOUT · Pink Theme</p><p class="muted">Your workout data is stored on this device.</p></section>'}
function setNav(p){var n=document.getElementsByClassName("nav"),i;for(i=0;i<n.length;i++)n[i].className="nav"+(n[i].getAttribute("data-page")===p?" on":"")}
var nav=document.getElementsByClassName("nav"),i;for(i=0;i<nav.length;i++)nav[i].onclick=function(){var p=this.getAttribute("data-page");if(p==="home")home();else if(p==="calendar")calendar();else if(p==="progress")progress();else settings()};
function boot(){try{var now=new Date();document.getElementById("date").innerHTML="📅 "+now.getFullYear()+"."+pad(now.getMonth()+1)+"."+pad(now.getDate());home();}catch(e){document.getElementById("main").innerHTML='<section class="panel"><div class="title">APP ERROR</div><div class="muted">'+String(e.message||e)+'</div></section>';}}
boot();
</script></body></html>
