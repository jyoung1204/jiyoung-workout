function safeText(v){return String(v==null?"":v).replace(/[&<>"']/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]})}
function calendarDetail(k,today){var v=db.sessions&&db.sessions[k],h='<div class="caldetail"><div class="title">'+safeText(k)+'</div>';if(!v){h+='<p class="muted">'+(k<today?'🍃 Rest day':'No workout saved for this day.')+'</p>'}else{h+='<p><b>'+safeText(v.routine||v.category||"Workout")+'</b></p>';if(Array.isArray(v.exercises)){for(var i=0;i<v.exercises.length;i++){var e=v.exercises[i];h+='<div class="calexercise"><b>'+(e.done?'✓ ':'○ ')+safeText(e.name)+'</b><span>'+safeText(e.weight||"—")+' kg · '+safeText(e.reps==null?"8":e.reps)+' reps · '+safeText(e.sets||"—")+' sets</span></div>'}if(v.note)h+='<div class="calnote"><b>📝 Notes</b><div>'+safeText(v.note).replace(/\n/g,"<br>")+'</div></div>'}else if(sessionCat(v)==="rest"){h+='<p class="muted">🍃 Rest day</p>'}else{h+='<p class="muted">이 날짜는 이전 방식으로 저장되어 종목별 상세 기록이 없어요.</p>'}}return h+'</div>'}
function calendar(){page="calendar";setNav("calendar");document.getElementById("routineTabs").innerHTML="";var d=new Date(),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate(),today=dateKey(d),h='<section class="panel"><div class="title">🗓️ '+d.toLocaleString("en-US",{month:"long"})+' '+y+'</div><div class="calgrid">',i,k,v,c;var names=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];for(i=0;i<7;i++)h+='<div class="muted">'+names[i]+'</div>';for(i=0;i<first;i++)h+="<div></div>";for(i=1;i<=last;i++){k=y+"-"+pad(m+1)+"-"+pad(i);v=db.sessions&&db.sessions[k];c=sessionCat(v);if(!v&&k<today)c="rest";h+='<button type="button" class="day '+c+'" data-date="'+k+'">'+i+'</button>'}h+='</div><div class="legend"><span><i class="dot upper"></i>Upper</span><span><i class="dot lower"></i>Lower</span><span><i class="dot core"></i>Core</span><span><i class="dot rest"></i>Rest</span></div><div id="calendarDetail" aria-live="polite"></div></section>';document.getElementById("main").innerHTML=h;var days=document.querySelectorAll(".day[data-date]");for(i=0;i<days.length;i++)days[i].onclick=function(){for(var j=0;j<days.length;j++)days[j].classList.remove("selected");this.classList.add("selected");document.getElementById("calendarDetail").innerHTML=calendarDetail(this.getAttribute("data-date"),today)}}
function progress(){page="progress";setNav("progress");document.getElementById("routineTabs").innerHTML="";var ct={upper:0,lower:0,core:0,rest:0},k,c,total=0,today=dateKey(new Date()),start=null;if(db.sessions)for(k in db.sessions){c=sessionCat(db.sessions[k]);if(ct[c]!==undefined){ct[c]++;total++;if(!start||k<start)start=k}}if(start){var sd=new Date(start+"T00:00:00"),x,xk;for(x=new Date(sd);dateKey(x)<today;x.setDate(x.getDate()+1)){xk=dateKey(x);if(!(db.sessions&&db.sessions[xk])){ct.rest++;total++}}}var h='<section class="panel"><div class="title">📊 Progress</div><div class="summary"><div class="sum upper"><b>'+ct.upper+'</b>Upper</div><div class="sum lower"><b>'+ct.lower+'</b>Lower</div><div class="sum core"><b>'+ct.core+'</b>Core</div><div class="sum rest"><b>'+ct.rest+'</b>Rest</div></div><div class="title" style="font-size:16px;margin-top:22px">Workout Distribution</div>';["upper","lower","core","rest"].forEach(function(x){var p=total?Math.round(ct[x]*100/total):0;h+='<div class="barrow"><b>'+x.charAt(0).toUpperCase()+x.slice(1)+'</b><div class="bar"><div class="fill '+x+'" style="width:'+p+'%"></div></div><span>'+p+'%</span></div>'});h+='<div class="muted" style="margin-top:16px">'+total+' days shown · includes automatic Rest days</div></section>';document.getElementById("main").innerHTML=h}
function settings(){page="settings";setNav("settings");document.getElementById("routineTabs").innerHTML="";document.getElementById("main").innerHTML='<section class="panel"><div class="title">⚙️ Settings</div><p>왕빵궁둥이 · Pink Theme</p><p class="muted">Your workout data is stored on this device.</p></section>'}
function setNav(p){var n=document.getElementsByClassName("nav"),i;for(i=0;i<n.length;i++)n[i].className="nav"+(n[i].getAttribute("data-page")===p?" on":"")}
var cats=document.getElementsByClassName("cat"),ci;for(ci=0;ci<cats.length;ci++)cats[ci].onclick=function(){var c=this.getAttribute("data-cat");setCat(c);if(page==="home"){if(c==="Upper")current="Dumbbell Upper A";else if(c==="Lower")current="Dumbbell Lower A";else if(c==="Core")current="Core";else if(c==="Rest"){var d=dateKey(new Date());if(!db.sessions)db.sessions={};db.sessions[d]={routine:"Rest",category:"Rest",time:new Date().getTime()};persist();alert("Rest day saved! 🍃");activeCat="Today"}home()}else if(page==="calendar")calendar();else if(page==="progress")progress()};var nav=document.getElementsByClassName("nav"),i;for(i=0;i<nav.length;i++)nav[i].onclick=function(){var p=this.getAttribute("data-page");if(p==="home")home();else if(p==="calendar")calendar();else if(p==="progress")progress();else settings()};
function boot(){try{var requested=new URLSearchParams(location.search).get("routine");if(requested&&routines[requested]){current=requested;activeCat=categoryOf(requested)}var now=new Date();document.getElementById("date").innerHTML="📅 "+now.getFullYear()+"."+pad(now.getMonth()+1)+"."+pad(now.getDate());home();}catch(e){document.getElementById("main").innerHTML='<section class="panel"><div class="title">APP ERROR</div><div class="muted">'+String(e.message||e)+'</div></section>';}}
boot();
</script></body></html>
