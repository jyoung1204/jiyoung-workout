<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JY WORKOUT</title>
<meta name="theme-color" content="#fff8f3">
<link rel="manifest" href="./manifest.json">
<style>
*{box-sizing:border-box}body{margin:0;background:#fff9f4;color:#523b40;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:28px 18px 60px}
h1{margin:0;color:#c73568;font-size:31px;letter-spacing:-1px}.sub{margin:12px 0 24px;color:#c73568;font-size:15px;font-weight:800;letter-spacing:6px}
.date{font-size:12px;color:#a77b87;margin-bottom:14px}.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}.tab{white-space:nowrap;border:1px solid #ffd4df;background:#fff;border-radius:16px;padding:10px 13px;color:#a95170}.tab.active{background:#ef6f9a;color:#fff;border-color:#ef6f9a}
.hero,.card,.notes{background:#fff;border:1px solid #ffe0e8;border-radius:20px;padding:16px;margin-top:12px;box-shadow:0 5px 18px rgba(190,70,110,.06)}
.heroline{display:flex;justify-content:space-between;align-items:center}.hero b{color:#b83d67}.badge{background:#fff0f4;color:#b95878;padding:5px 9px;border-radius:20px;font-size:12px}
.progress{height:8px;background:#fae6ec;border-radius:10px;overflow:hidden;margin:12px 0 6px}.bar{height:100%;background:#ef6f9a;width:0}
.exerciseHead{display:flex;gap:12px;align-items:center}.pic{width:48px;height:48px;border-radius:15px;background:#fff0f4;display:flex;align-items:center;justify-content:center;font-size:25px;flex:none}.name{font-size:17px;font-weight:800}.target{font-size:12px;color:#a77b87;margin-top:3px}
.sets{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}.set{background:#fffafa;border:1px solid #f7d6df;border-radius:13px;padding:8px}.set label{font-size:10px;color:#b98b96}.set input{width:100%;border:0;border-bottom:1px solid #efd0d8;background:transparent;padding:6px 1px;font-size:16px;outline:none}.check{width:100%;margin-top:7px;border:0;border-radius:9px;padding:7px;background:#f7e8ed;color:#b95878}.check.on{background:#ef6f9a;color:#fff}
textarea{width:100%;min-height:75px;margin-top:9px;border:1px solid #f4d4dc;border-radius:12px;padding:10px;background:#fffafa}.primary,.secondary{width:100%;border:0;border-radius:13px;padding:13px;margin-top:10px;font-weight:800}.primary{background:#ef6f9a;color:#fff}.secondary{background:#fff0f4;color:#b83d67}
.share{background:linear-gradient(145deg,#fff,#ffeaf0);border:1px solid #ffd4df;border-radius:22px;padding:20px;margin-top:14px}.share h2{margin:0;color:#b83d67}.shareline{padding:8px 0;border-bottom:1px solid #f5d5dd;font-size:13px}.hidden{display:none}.small{font-size:11px;color:#a77b87}
@media(max-width:520px){.sets{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body><div class="wrap">
<h1>JY WORKOUT 🏋️‍♀️</h1><div class="sub">CONSISTENCY</div>
<div id="date" class="date"></div><div id="tabs" class="tabs"></div><div id="app"></div>
</div>
<script>
var routines={
"Dumbbell Upper A":[["Dumbbell Bench Press","8–12 reps × 3 sets"],["One-Arm Dumbbell Row","8–12 reps × 3 sets"],["Dumbbell Shoulder Press","8–12 reps × 3 sets"],["Dumbbell Lateral Raise","12–15 reps × 3 sets"],["Dumbbell Curl","10–12 reps × 2 sets"],["Dumbbell Overhead Triceps Extension","10–12 reps × 2 sets"]],
"Dumbbell Upper B":[["Incline Dumbbell Press","8–12 reps × 3 sets"],["Dumbbell Row","8–12 reps × 3 sets"],["Dumbbell Arnold Press","8–12 reps × 3 sets"],["Dumbbell Rear Delt Fly","12–15 reps × 3 sets"],["Hammer Curl","10–12 reps × 2 sets"],["Dumbbell Kickback","10–12 reps × 2 sets"]],
"Dumbbell Lower A":[["Hip Thrust","10–12 reps × 3 sets"],["Leg Press","8–12 reps × 3 sets"],["V-Squat","8–12 reps × 3 sets"],["Bulgarian Split Squat","8–10 reps/leg × 3 sets"],["Romanian Deadlift (RDL)","8–12 reps × 3 sets"],["Single-Leg RDL","8–10 reps/leg × 3 sets"],["Dumbbell Step-Up","8–12 reps/leg × 3 sets"],["Kettlebell Wide Squat","10–12 reps × 3 sets"],["Dumbbell Pause Squat","8–12 reps × 3 sets"],["Dumbbell Reverse Lunge","10 reps/leg × 3 sets"]],
"Dumbbell Lower B":[["Dumbbell Squat","8–12 reps × 3 sets"],["Dumbbell Sumo Squat","10–12 reps × 3 sets"],["Single-Leg RDL","8–10 reps/leg × 3 sets"],["Dumbbell Glute Bridge","12–15 reps × 3 sets"],["Dumbbell Walking Lunge","10 reps/leg × 2 sets"],["Dumbbell Calf Raise","15–20 reps × 3 sets"]],
"Core":[["Hanging Leg Raise","8–12 reps × 3 sets"],["Reverse Crunch","10–15 reps × 3 sets"],["Pallof Press","10–12 reps × 3 sets"],["Cable Wood Chop","10–12 reps × 3 sets"],["Back Extension","10–15 reps × 3 sets"]],
"Machine Upper A":[["Lat Pulldown","8–12 reps × 3 sets"],["Seated Row","8–12 reps × 3 sets"],["Chest Press","8–12 reps × 3 sets"],["Shoulder Press","8–12 reps × 3 sets"],["Rear Delt Fly","12–15 reps × 3 sets"]],
"Machine Upper B":[["Front Pulldown","8–12 reps × 3 sets"],["Lever Row","8–12 reps × 3 sets"],["Wide-Grip Pulldown","8–12 reps × 3 sets"],["Rear Delt Fly","12–15 reps × 3 sets"],["Dips","8–12 reps × 3 sets"]],
"Machine Lower A":[["Leg Press","8–12 reps × 3 sets"],["Leg Curl","10–12 reps × 3 sets"],["Leg Extension","10–12 reps × 3 sets"],["Hip Press","10–15 reps × 3 sets"],["Hip Abduction","12–15 reps × 3 sets"]],
"Machine Lower B":[["Monster Glute Machine","10–15 reps × 3 sets"],["Leg Press","8–12 reps × 3 sets"],["Hip Adduction","12–15 reps × 3 sets"],["Standing Hip Abduction","10–15 reps × 3 sets"],["Seated Leg Curl","10–12 reps × 3 sets"]]
};
var current="Dumbbell Lower A",history={};
try{var sr=localStorage.getItem("routine");if(sr&&routines[sr])current=sr;var sh=localStorage.getItem("workoutHistory");if(sh)history=JSON.parse(sh)||{}}catch(e){history={}}
function save(){try{localStorage.setItem("routine",current);localStorage.setItem("workoutHistory",JSON.stringify(history))}catch(e){}}
function nsets(t){var m=t.match(/×[ ]*([0-9]+)/);return m?parseInt(m[1],10):3}
function icon(n){if(n.indexOf("Hip")>=0||n.indexOf("Glute")>=0)return "🍑";if(n.indexOf("Leg")>=0||n.indexOf("Lunge")>=0||n.indexOf("Squat")>=0||n.indexOf("Step")>=0)return "🦵";if(n.indexOf("Row")>=0||n.indexOf("Pulldown")>=0)return "🚣‍♀️";if(n.indexOf("Press")>=0)return "🏋️‍♀️";if(n.indexOf("RDL")>=0||n.indexOf("Deadlift")>=0)return "🏋️";if(n.indexOf("Curl")>=0)return "💪";return "✨"}
function val(rec,s,k){return rec&&rec.sets&&rec.sets[s]&&rec.sets[s][k]?rec.sets[s][k]:""}
function render(){
 var tabs="",keys=Object.keys(routines),i,j,x,n,key,rec,h="",total=0;
 for(i=0;i<keys.length;i++)tabs+='<button class="tab '+(keys[i]===current?'active':'')+'" data-r="'+encodeURIComponent(keys[i])+'">'+keys[i]+'</button>';
 document.getElementById("tabs").innerHTML=tabs;
 var buttons=document.getElementById("tabs").getElementsByTagName("button");
 for(i=0;i<buttons.length;i++)buttons[i].onclick=function(){current=decodeURIComponent(this.getAttribute("data-r"));save();render()};
 for(i=0;i<routines[current].length;i++)total+=nsets(routines[current][i][1]);
 h='<div class="hero"><div class="heroline"><div><b>TODAY\'S WORKOUT</b><div class="small">'+current+'</div></div><span class="badge">'+total+' sets</span></div><div class="progress"><div id="bar" class="bar"></div></div><div id="pct" class="small">0% DONE</div></div>';
 for(i=0;i<routines[current].length;i++){x=routines[current][i];n=nsets(x[1]);key=current+"|"+i;rec=history[key]||{sets:[],checks:[]};
  h+='<div class="card"><div class="exerciseHead"><div class="pic">'+icon(x[0])+'</div><div><div class="name">'+x[0]+'</div><div class="target">'+x[1]+'</div></div></div><div class="sets">';
  for(j=0;j<n;j++)h+='<div class="set"><label>SET '+(j+1)+'</label><input inputmode="decimal" placeholder="kg" data-i="'+i+'" data-s="'+j+'" data-k="w" value="'+val(rec,j,"w")+'"><input inputmode="numeric" placeholder="reps" data-i="'+i+'" data-s="'+j+'" data-k="r" value="'+val(rec,j,"r")+'"><button class="check '+(rec.checks&&rec.checks[j]?'on':'')+'" data-ci="'+i+'" data-cs="'+j+'" data-cn="'+n+'">'+(rec.checks&&rec.checks[j]?'✓ DONE':'○ CHECK')+'</button></div>';
  h+='</div></div>';
 }
 h+='<div class="notes"><b>TODAY NOTES</b><textarea id="note" placeholder="Condition / pain / notes">'+(history["NOTE|"+current]||"")+'</textarea><button id="saveNote" class="secondary">SAVE NOTE</button></div><button id="finish" class="primary">SAVE TODAY\'S WORKOUT ♥</button><button id="shareBtn" class="secondary">INSTAGRAM WORKOUT CARD 📸</button><div id="share" class="hidden"></div>';
 document.getElementById("app").innerHTML=h;bind();progress();
}
function bind(){var ins=document.getElementById("app").getElementsByTagName("input"),i,bs=document.getElementById("app").getElementsByClassName("check");
 for(i=0;i<ins.length;i++)ins[i].oninput=function(){var key=current+"|"+this.getAttribute("data-i"),s=parseInt(this.getAttribute("data-s"),10),k=this.getAttribute("data-k");if(!history[key])history[key]={sets:[],checks:[]};if(!history[key].sets)history[key].sets=[];if(!history[key].sets[s])history[key].sets[s]={};history[key].sets[s][k]=this.value;save()};
 for(i=0;i<bs.length;i++)bs[i].onclick=function(){var a=parseInt(this.getAttribute("data-ci"),10),s=parseInt(this.getAttribute("data-cs"),10),n=parseInt(this.getAttribute("data-cn"),10),key=current+"|"+a;if(!history[key])history[key]={sets:[],checks:[]};if(!history[key].checks)history[key].checks=[];while(history[key].checks.length<n)history[key].checks.push(false);history[key].checks[s]=!history[key].checks[s];save();render()};
 document.getElementById("saveNote").onclick=function(){history["NOTE|"+current]=document.getElementById("note").value;save();alert("Note saved ♥")};
 document.getElementById("finish").onclick=function(){history["NOTE|"+current]=document.getElementById("note").value;history["SESSION|"+new Date().toISOString()]=current;save();alert("Workout saved! 💪")};
 document.getElementById("shareBtn").onclick=shareCard;
}
function progress(){var total=0,done=0,i,j,r;for(i=0;i<routines[current].length;i++){total+=nsets(routines[current][i][1]);r=history[current+"|"+i];if(r&&r.checks)for(j=0;j<r.checks.length;j++)if(r.checks[j])done++}var p=total?Math.round(done*100/total):0;document.getElementById("bar").style.width=p+"%";document.getElementById("pct").innerHTML=p+"% DONE"}
function shareCard(){var i,j,r,line="",d=new Date();for(i=0;i<routines[current].length;i++){r=history[current+"|"+i]||{};line+='<div class="shareline"><b>'+routines[current][i][0]+'</b>';if(r.sets)for(j=0;j<r.sets.length;j++)if(r.sets[j]&&(r.sets[j].w||r.sets[j].r))line+=' · '+(r.sets[j].w?r.sets[j].w+'kg ':'')+(r.sets[j].r?r.sets[j].r+' reps':'');line+='</div>'}var box=document.getElementById("share");box.className="share";box.innerHTML='<h2>JY WORKOUT ♥</h2><div class="small">'+d.toLocaleDateString()+' · '+current+'</div>'+line;box.scrollIntoView()}
document.getElementById("date").innerHTML=new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
render();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").then(function(r){r.update()})})}</script>
</body></html>
