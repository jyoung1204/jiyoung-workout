function calendarDetail(k,today){var v=db.sessions&&db.sessions[k],h='<div class="caldetail"><div class="title">'+safeText(k)+'</div>';if(!v){h+='<p class="muted">'+(activitiesOn(k).length?'':k<today?'🍃 Rest day':'No workout saved for this day.')+'</p>'}else{h+='<p><b>'+safeText(v.routine||v.category||"Workout")+'</b></p>';if(Array.isArray(v.exercises)){for(var i=0;i<v.exercises.length;i++){var e=v.exercises[i];if(!e.done)continue;h+='<div class="calexercise"><b>'+(e.done?'✓ ':'○ ')+safeText(e.name)+'</b><span>'+(e.unit==="min"?safeText(e.reps||"—")+" min":(e.unit==="sec"?"":safeText(e.weight||"—")+" kg · ")+safeText(e.reps==null?"8":e.reps)+" "+safeText(e.unit||"reps")+" · "+safeText(e.sets||"—")+" sets")+'</span></div>'}if(v.note)h+='<div class="calnote"><b>📝 Notes</b><div>'+safeText(v.note).replace(/\n/g,"<br>")+'</div></div>'}else if(sessionCat(v)==="rest"){h+='<p class="muted">🍃 Rest day</p>'}else{h+='<p class="muted">이 날짜는 이전 방식으로 저장되어 종목별 상세 기록이 없어요.</p>'}}return h+activityDetail(k)+'</div>'}
var calendarViewDate=new Date();

function calendar(){page="calendar";document.getElementById("workoutDatePanel").style.display="none";setNav("calendar");document.getElementById("routineTabs").innerHTML="";var now=new Date(),d=new Date(calendarViewDate.getFullYear(),calendarViewDate.getMonth(),1),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate(),today=dateKey(now),h='<section class="panel calendar-panel"><div class="title" style="display:flex;align-items:center;justify-content:space-between;gap:10px"><button type="button" onclick="changeCalendarMonth(-1)" aria-label="Previous month" style="border:0;background:#fff0f4;border-radius:12px;padding:8px 12px;color:#b52f64;font-size:20px">‹</button><span class="calendar-month">'+d.toLocaleString("en-US",{month:"long"})+' '+y+'</span><button type="button" onclick="changeCalendarMonth(1)" aria-label="Next month" style="border:0;background:#fff0f4;border-radius:12px;padding:8px 12px;color:#b52f64;font-size:20px">›</button></div><div class="calgrid">',i,k,v,c;var names=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];for(i=0;i<7;i++)h+='<div class="muted">'+names[i]+'</div>';for(i=0;i<first;i++)h+="<div></div>";for(i=1;i<=last;i++){k=y+"-"+pad(m+1)+"-"+pad(i);v=db.sessions&&db.sessions[k];c=sessionCat(v);if(!v&&k<today&&!activitiesOn(k).length)c="rest";if(c==="rest"&&activitiesOn(k).length)c="";h+='<button type="button" class="day '+c+'" data-date="'+k+'">'+i+'<span class="activity-badges">'+activityBadges(k)+'</span></button>'}h+='</div><div class="legend"><span><i class="dot upper"></i>Upper</span><span><i class="dot lower"></i>Lower</span><span><i class="dot core"></i>Core</span><span><i class="dot rest"></i>Rest</span><span>'+activityIcon("hiking")+' Hiking</span><span>'+activityIcon("swimming")+' Swimming</span></div><div id="calendarDetail" aria-live="polite"></div></section><div class="calendar-activity-action"><button type="button" class="btn" onclick="startActivityRecord()">+ '+activityIcon("swimming")+' 수영 · '+activityIcon("hiking")+' 등산 기록</button></div>';document.getElementById("main").innerHTML=h;var days=document.querySelectorAll(".day[data-date]");for(i=0;i<days.length;i++)days[i].onclick=function(){selectCalendarDate(this.getAttribute("data-date"))}}
function progress(){page="progress";document.getElementById("workoutDatePanel").style.display="none";setNav("progress");document.getElementById("routineTabs").innerHTML="";var ct={upper:0,lower:0,core:0,rest:0},k,c,total=0,today=dateKey(new Date()),start=null;if(db.sessions)for(k in db.sessions){c=sessionCat(db.sessions[k]);if(ct[c]!==undefined&&!(c==="rest"&&activitiesOn(k).length)){ct[c]++;total++;if(!start||k<start)start=k}}if(start){var sd=new Date(start+"T00:00:00"),x,xk;for(x=new Date(sd);dateKey(x)<today;x.setDate(x.getDate()+1)){xk=dateKey(x);if(!(db.sessions&&db.sessions[xk])&&!activitiesOn(xk).length){ct.rest++;total++}}}var h='<section class="panel"><div class="title">📊 Progress</div><div class="summary"><div class="sum upper"><b>'+ct.upper+'</b>Upper</div><div class="sum lower"><b>'+ct.lower+'</b>Lower</div><div class="sum core"><b>'+ct.core+'</b>Core</div><div class="sum rest"><b>'+ct.rest+'</b>Rest</div></div><div class="title" style="font-size:16px;margin-top:22px">Workout Distribution</div>';["upper","lower","core","rest"].forEach(function(x){var p=total?Math.round(ct[x]*100/total):0;h+='<div class="barrow"><b>'+x.charAt(0).toUpperCase()+x.slice(1)+'</b><div class="bar"><div class="fill '+x+'" style="width:'+p+'%"></div></div><span>'+p+'%</span></div>'});h+='<div class="muted" style="margin-top:16px">'+total+' days shown · includes automatic Rest days</div></section>';document.getElementById("main").innerHTML=h}

function appendCoreFinishers(){
 Object.keys(routines).forEach(function(name){
  var leg=null,reverse=null,hanging=null,cardio=null,rest=[];
  routines[name].forEach(function(ex){
   var normalized=normalExercise(ex[1]);
   if(normalized==="leg raise"){if(!leg)leg=ex;return}
   if(normalized==="reverse crunch"){if(!reverse)reverse=ex;return}
   if(normalized==="dead hang"||normalized==="hanging"){if(!hanging){hanging=ex.slice();hanging[1]="Hanging"}return}
   if(isCardio(ex)||normalized==="easy cardio"||normalized==="cardio"){if(!cardio)cardio=ex;return}
   rest.push(ex);
  });
  if(!leg)leg=["✦","Leg Raise",3,"15"];
  if(!reverse)reverse=["✦","Reverse Crunch",3,"15"];
  if(!hanging)hanging=["✦","Hanging",3,"30 sec"];
  if(!cardio)cardio=["♡","Easy Cardio",1,cardioMinutes(name)+" min","cardio"];
  cardio=cardio.slice();cardio[4]="cardio";
  routines[name]=rest.concat([leg,reverse,hanging,cardio]);
 });
}
