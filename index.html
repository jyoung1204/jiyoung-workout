<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JY WORKOUT</title>
<meta name="theme-color" content="#f477a1">
<link rel="manifest" href="./manifest.json">
<style>
*{box-sizing:border-box}body{margin:0;background:#fff9f4;color:#543c43;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:28px 18px 60px}h1{margin:0;color:#c73568;font-size:31px}.sub{margin:12px 0 22px;color:#c73568;font-weight:800;letter-spacing:6px;font-size:15px}.date{font-size:12px;color:#a67b87;margin-bottom:12px}.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}.tab{white-space:nowrap;border:1px solid #ffd4df;background:#fff;border-radius:16px;padding:10px 13px;color:#a95170}.tab.active{background:#ef6f9a;color:#fff}.card,.hero{background:#fff;border:1px solid #ffe0e8;border-radius:20px;padding:16px;margin-top:12px;box-shadow:0 5px 18px rgba(190,70,110,.06)}.heroRow,.exHead{display:flex;align-items:center;justify-content:space-between;gap:10px}.pic{width:50px;height:50px;border-radius:15px;background:#fff0f4;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}.exInfo{flex:1}.name{font-size:17px;font-weight:800}.target,.small{font-size:12px;color:#a67b87}.badge{background:#fff0f4;color:#b95878;padding:5px 9px;border-radius:20px;font-size:12px}.progress{height:8px;background:#fae6ec;border-radius:10px;overflow:hidden;margin:12px 0 6px}.bar{height:100%;background:#ef6f9a;width:0}.sets{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}.set{background:#fffafa;border:1px solid #f7d6df;border-radius:13px;padding:8px}.set label{font-size:10px;color:#b98b96}.set input{width:100%;border:0;border-bottom:1px solid #efd0d8;background:transparent;padding:6px 1px;font-size:16px;outline:none}.check{width:100%;margin-top:7px;border:0;border-radius:9px;padding:7px;background:#f7e8ed;color:#b95878}.check.on{background:#ef6f9a;color:#fff}textarea{width:100%;min-height:75px;margin-top:9px;border:1px solid #f4d4dc;border-radius:12px;padding:10px;background:#fffafa}.primary,.secondary{width:100%;border:0;border-radius:13px;padding:13px;margin-top:10px;font-weight:800}.primary{background:#ef6f9a;color:#fff}.secondary{background:#fff0f4;color:#b83d67}.share{background:linear-gradient(145deg,#fff,#ffeaf0);border:1px solid #ffd4df;border-radius:22px;padding:20px;margin-top:14px}.share h2{margin:0;color:#b83d67}.shareline{padding:8px 0;border-bottom:1px solid #f5d5dd;font-size:13px}@media(max-width:520px){.sets{grid-template-columns:repeat(3,1fr)}}

.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.datePill{background:#fff0f4;border-radius:18px;padding:12px 14px;color:#8d6570;font-size:12px;white-space:nowrap}.motto{margin-top:-16px;margin-bottom:20px;color:#8d7c82;font-size:13px}.mainnav{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px 0 14px}.mainnav button{border:1px solid #f5d6df;background:#fff;border-radius:17px;padding:11px 4px;color:#9d4263;font-weight:700}.mainnav .hot{background:#ef4f87;color:#fff}.hero{border-radius:24px}.card{border-radius:18px}.exHead{justify-content:flex-start}.pic{background:#fff3f6}.primary{font-size:15px}.bottomnav{position:sticky;bottom:0;margin:20px -18px -60px;padding:13px 18px 20px;background:rgba(255,249,244,.96);border-top:1px solid #f6dce3;display:grid;grid-template-columns:repeat(4,1fr);text-align:center;color:#887a80;font-size:11px}.bottomnav b{display:block;font-size:22px;margin-bottom:3px}.bottomnav .active{color:#df3d76}@media(max-width:520px){h1{font-size:29px}.datePill{padding:9px;font-size:10px}.mainnav button{font-size:11px}.motto{font-size:11px}}
.calendarGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}.day{aspect-ratio:1;border-radius:12px;background:#fff7f9;display:flex;align-items:center;justify-content:center;font-size:12px}.day.worked{background:#ef6f9a;color:#fff;font-weight:800}.statGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.stat{background:#fff0f4;border-radius:16px;padding:18px;text-align:center}.stat strong{display:block;color:#c73568;font-size:26px}.navitem{cursor:pointer}.settingsRow{padding:14px 0;border-bottom:1px solid #f6dce3}</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><h1>JY WORKOUT 🏋️‍♀️</h1><div class="sub">CONSISTENCY</div></div><div id="datePill" class="datePill">TODAY</div></div>
<div class="motto">Discipline today, the body you love tomorrow.</div><div id="date" class="date"></div><div class="mainnav"><button>🏠 Today</button><button>💪🏻 Upper</button><button class="hot">🍑 Lower</button><button>🏃‍♀️ Core</button><button>••• More</button></div>
<div id="tabs" class="tabs"></div>
<div id="app"><div class="hero">Loading workout...</div></div>
<div class="bottomnav"><div class="navitem active" data-page="home"><b>🏠</b>Home</div><div class="navitem" data-page="calendar"><b>🗓️</b>Calendar</div><div class="navitem" data-page="progress"><b>📊</b>Progress</div><div class="navitem" data-page="settings"><b>⚙️</b>Settings</div></div></div>
<script>
var routines={
"Dumbbell Upper A":[["Dumbbell Bench Press","8-12 reps x 3 sets"],["One-Arm Dumbbell Row","8-12 reps x 3 sets"],["Dumbbell Shoulder Press","8-12 reps x 3 sets"],["Dumbbell Lateral Raise","12-15 reps x 3 sets"],["Dumbbell Curl","10-12 reps x 2 sets"]],
"Dumbbell Upper B":[["Incline Dumbbell Press","8-12 reps x 3 sets"],["Dumbbell Row","8-12 reps x 3 sets"],["Dumbbell Arnold Press","8-12 reps x 3 sets"],["Dumbbell Rear Delt Fly","12-15 reps x 3 sets"],["Hammer Curl","10-12 reps x 2 sets"]],
"Dumbbell Lower A":[["Hip Thrust","10-12 reps x 3 sets"],["Leg Press","8-12 reps x 3 sets"],["V-Squat","8-12 reps x 3 sets"],["Bulgarian Split Squat","8-10 reps/leg x 3 sets"],["Romanian Deadlift (RDL)","8-12 reps x 3 sets"],["Single-Leg RDL","8-10 reps/leg x 3 sets"],["Dumbbell Step-Up","8-12 reps/leg x 3 sets"],["Kettlebell Wide Squat","10-12 reps x 3 sets"],["Dumbbell Pause Squat","8-12 reps x 3 sets"],["Dumbbell Reverse Lunge","10 reps/leg x 3 sets"]],
"Dumbbell Lower B":[["Dumbbell Squat","8-12 reps x 3 sets"],["Dumbbell Sumo Squat","10-12 reps x 3 sets"],["Single-Leg RDL","8-10 reps/leg x 3 sets"],["Dumbbell Glute Bridge","12-15 reps x 3 sets"],["Dumbbell Walking Lunge","10 reps/leg x 2 sets"]],
"Core":[["Hanging Leg Raise","8-12 reps x 3 sets"],["Reverse Crunch","10-15 reps x 3 sets"],["Pallof Press","10-12 reps x 3 sets"],["Cable Wood Chop","10-12 reps x 3 sets"],["Back Extension","10-15 reps x 3 sets"]],
"Machine Upper A":[["Lat Pulldown","8-12 reps x 3 sets"],["Seated Row","8-12 reps x 3 sets"],["Chest Press","8-12 reps x 3 sets"],["Shoulder Press","8-12 reps x 3 sets"],["Rear Delt Fly","12-15 reps x 3 sets"]],
"Machine Upper B":[["Front Pulldown","8-12 reps x 3 sets"],["Lever Row","8-12 reps x 3 sets"],["Wide-Grip Pulldown","8-12 reps x 3 sets"],["Rear Delt Fly","12-15 reps x 3 sets"],["Dips","8-12 reps x 3 sets"]],
"Machine Lower A":[["Leg Press","8-12 reps x 3 sets"],["Leg Curl","10-12 reps x 3 sets"],["Leg Extension","10-12 reps x 3 sets"],["Hip Press","10-15 reps x 3 sets"],["Hip Abduction","12-15 reps x 3 sets"]],
"Machine Lower B":[["Monster Glute Machine","10-15 reps x 3 sets"],["Leg Press","8-12 reps x 3 sets"],["Hip Adduction","12-15 reps x 3 sets"],["Standing Hip Abduction","10-15 reps x 3 sets"],["Seated Leg Curl","10-12 reps x 3 sets"]]
};
var current="Dumbbell Lower A";
var history={};
try{var oldRoutine=localStorage.getItem("routine");if(oldRoutine&&routines[oldRoutine])current=oldRoutine;var oldHistory=localStorage.getItem("workoutHistory");if(oldHistory)history=JSON.parse(oldHistory)||{};}catch(err){history={};}
function save(){try{localStorage.setItem("routine",current);localStorage.setItem("workoutHistory",JSON.stringify(history));}catch(err){}}
function setCount(text){var m=text.match(/x ([0-9]+) sets/);return m?parseInt(m[1],10):3;}
function icon(name){if(name.indexOf("Hip")>=0||name.indexOf("Glute")>=0)return "🍑";if(name.indexOf("Squat")>=0||name.indexOf("Lunge")>=0||name.indexOf("Leg")>=0||name.indexOf("Step")>=0)return "🦵";if(name.indexOf("Row")>=0||name.indexOf("Pulldown")>=0)return "🚣‍♀️";if(name.indexOf("Curl")>=0)return "💪";return "🏋️‍♀️";}
function safeValue(rec,s,k){if(rec&&rec.sets&&rec.sets[s]&&rec.sets[s][k])return rec.sets[s][k];return "";}
function render(){
var keys=Object.keys(routines),i,j,html="",tabs="";
for(i=0;i<keys.length;i++){tabs+='<button class="tab '+(keys[i]===current?'active':'')+'" data-name="'+encodeURIComponent(keys[i])+'">'+keys[i]+'</button>';}
document.getElementById("tabs").innerHTML=tabs;
var tabButtons=document.getElementById("tabs").getElementsByTagName("button");
for(i=0;i<tabButtons.length;i++){tabButtons[i].onclick=function(){current=decodeURIComponent(this.getAttribute("data-name"));save();render();};}
var total=0;for(i=0;i<routines[current].length;i++)total+=setCount(routines[current][i][1]);
html+='<div class="hero"><div class="heroRow"><div><b>🍑 &nbsp;'+current+'</b><div class="small">Glutes · Legs · Stronger Lower Body</div></div><button class="secondary" style="width:auto;margin:0;padding:9px 12px" onclick="resetAll()">↻ Reset All</button></div><div class="progress"><div id="bar" class="bar"></div></div><div id="pct" class="small">0% DONE</div></div>';
for(i=0;i<routines[current].length;i++){
var ex=routines[current][i],n=setCount(ex[1]),key=current+"|"+i,rec=history[key]||{sets:[],checks:[]};
html+='<div class="card"><div class="exHead"><div class="pic">'+icon(ex[0])+'</div><div class="exInfo"><div class="name">'+ex[0]+'</div><div class="target">'+ex[1]+'</div></div></div><div class="sets">';
for(j=0;j<n;j++){var checked=rec.checks&&rec.checks[j];html+='<div class="set"><label>SET '+(j+1)+'</label><input inputmode="decimal" placeholder="kg" data-i="'+i+'" data-s="'+j+'" data-k="w" value="'+safeValue(rec,j,"w")+'"><input inputmode="numeric" placeholder="reps" data-i="'+i+'" data-s="'+j+'" data-k="r" value="'+safeValue(rec,j,"r")+'"><button class="check '+(checked?'on':'')+'" data-ci="'+i+'" data-cs="'+j+'" data-cn="'+n+'">'+(checked?'✓ DONE':'○ CHECK')+'</button></div>';}
html+='</div></div>';
}
html+='<div class="card"><b>TODAY NOTES</b><textarea id="note" placeholder="Condition / pain / notes">'+(history["NOTE|"+current]||"")+'</textarea><button id="saveNote" class="secondary">SAVE NOTE</button></div><button id="finish" class="primary">SAVE TODAY&#39;S WORKOUT ♥</button><button id="shareBtn" class="secondary">INSTAGRAM WORKOUT CARD 📸</button><div id="share"></div>';
document.getElementById("app").innerHTML=html;
bind();updateProgress();
}
function bind(){
var inputs=document.getElementById("app").getElementsByTagName("input"),checks=document.getElementById("app").getElementsByClassName("check"),i;
for(i=0;i<inputs.length;i++){inputs[i].oninput=function(){var idx=this.getAttribute("data-i"),s=parseInt(this.getAttribute("data-s"),10),k=this.getAttribute("data-k"),key=current+"|"+idx;if(!history[key])history[key]={sets:[],checks:[]};if(!history[key].sets)history[key].sets=[];if(!history[key].sets[s])history[key].sets[s]={};history[key].sets[s][k]=this.value;save();};}
for(i=0;i<checks.length;i++){checks[i].onclick=function(){var idx=this.getAttribute("data-ci"),s=parseInt(this.getAttribute("data-cs"),10),n=parseInt(this.getAttribute("data-cn"),10),key=current+"|"+idx;if(!history[key])history[key]={sets:[],checks:[]};if(!history[key].checks)history[key].checks=[];while(history[key].checks.length<n)history[key].checks.push(false);history[key].checks[s]=!history[key].checks[s];save();render();};}
document.getElementById("saveNote").onclick=function(){history["NOTE|"+current]=document.getElementById("note").value;save();alert("Note saved ♥");};
document.getElementById("finish").onclick=function(){history["NOTE|"+current]=document.getElementById("note").value;history["SESSION|"+new Date().toISOString()]=current;save();alert("Workout saved! 💪");};
document.getElementById("shareBtn").onclick=showShare;
}
function updateProgress(){var total=0,done=0,i,j,rec;for(i=0;i<routines[current].length;i++){total+=setCount(routines[current][i][1]);rec=history[current+"|"+i];if(rec&&rec.checks){for(j=0;j<rec.checks.length;j++){if(rec.checks[j])done++;}}}var p=total?Math.round(done*100/total):0;document.getElementById("bar").style.width=p+"%";document.getElementById("pct").innerHTML=p+"% DONE";}
function resetAll(){if(confirm("Reset all checks and entries for this routine?")){var i;for(i=0;i<routines[current].length;i++)delete history[current+"|"+i];save();render();}}function dayKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function sessions(){var a=[],k;for(k in history)if(k.indexOf("SESSION|")===0)a.push(k.substring(8,18));return a;}function setNav(p){var ns=document.getElementsByClassName("navitem"),i;for(i=0;i<ns.length;i++)ns[i].className="navitem"+(ns[i].getAttribute("data-page")===p?" active":"");}function showPage(p){setNav(p);if(p==="home"){render();return;}var app=document.getElementById("app"),d=new Date(),html="";if(p==="calendar"){var y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate(),ss=sessions(),i;html='<div class="hero"><b>🗓️ WORKOUT CALENDAR</b><div class="small">'+d.toLocaleString("en-US",{month:"long"})+" "+y+'</div><div class="calendarGrid">Sun Mon Tue Wed Thu Fri Sat'.split(" ").map(function(x){return "<div class=small>"+x+"</div>"}).join("");for(i=0;i<first;i++)html+="<div></div>";for(i=1;i<=last;i++){var k=y+"-"+String(m+1).padStart(2,"0")+"-"+String(i).padStart(2,"0");html+='<div class="day '+(ss.indexOf(k)>=0?"worked":"")+'">'+i+"</div>"}html+="</div></div>";}else if(p==="progress"){var ss=sessions(),uniq={},i;for(i=0;i<ss.length;i++)uniq[ss[i]]=1;var days=Object.keys(uniq).length;html='<div class="hero"><b>📊 PROGRESS</b><div class="small">Your consistency at a glance</div><div class="statGrid"><div class="stat"><strong>'+days+'</strong>Workout Days</div><div class="stat"><strong>'+ss.length+'</strong>Saved Sessions</div></div></div><div class="card"><b>KEEP SHOWING UP 💗</b><div class="small" style="margin-top:8px">Every saved workout builds your consistency record.</div></div>';}else{html='<div class="hero"><b>⚙️ SETTINGS</b><div class="settingsRow">JY WORKOUT</div><div class="settingsRow">Theme · Pink</div><div class="settingsRow">Data is saved on this device</div></div>';}app.innerHTML=html;}function bindNav(){var ns=document.getElementsByClassName("navitem"),i;for(i=0;i<ns.length;i++)ns[i].onclick=function(){showPage(this.getAttribute("data-page"));};}function showShare(){var i,rec,lines="",box=document.getElementById("share");for(i=0;i<routines[current].length;i++){rec=history[current+"|"+i];var done=0,j;if(rec&&rec.checks){for(j=0;j<rec.checks.length;j++)if(rec.checks[j])done++;}lines+='<div class="shareline"><b>'+routines[current][i][0]+'</b> · '+done+'/'+setCount(routines[current][i][1])+' sets</div>';}box.className="share";box.innerHTML='<h2>JY WORKOUT ♥</h2><div class="small">'+current+'</div>'+lines;box.scrollIntoView();}
try{var now=new Date();document.getElementById("date").innerHTML="";document.getElementById("datePill").innerHTML="📅 "+now.getFullYear()+"."+(now.getMonth()+1)+"."+now.getDate();render();bindNav();}catch(err){document.getElementById("app").innerHTML='<div class="card"><b>APP ERROR</b><div class="small">'+String(err.message||err)+'</div></div>';}
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").then(function(r){r.update();});});}
</script>
</body>
</html>
